# ============================================
# Nginx Configuration — Flash Sale Manager
# ============================================
# Nginx serves as a REVERSE PROXY and LOAD BALANCER.
#
# REVERSE PROXY: Clients talk to Nginx, not directly to Express.
#   Client → Nginx → Express API
#   Nginx hides the internal architecture. Clients see one endpoint.
#
# LOAD BALANCER: Nginx distributes requests across multiple API replicas.
#   Client → Nginx → API-1 / API-2 / API-3 (round-robin)
#
# WHY Nginx in front of Express:
# 1. Express is single-threaded. One instance can saturate one CPU core.
#    Nginx distributes traffic across N instances = N cores utilized.
# 2. Nginx handles static files, SSL termination, and connection management
#    FAR more efficiently than Node.js (~50K concurrent connections).
# 3. If API-2 crashes, Nginx stops sending traffic to it. Clients don't notice.
# 4. Clients only need to know one address (nginx:80), not individual API ports.

# ============================================
# Upstream — Define the pool of API servers
# ============================================
# 'upstream' creates a named group of backend servers.
# Nginx load-balances across this group.
#
# ALGORITHM: Round Robin (default)
# Each request goes to the next server in sequence:
#   Request 1 → api-1
#   Request 2 → api-2
#   Request 3 → api-3
#   Request 4 → api-1 (wraps around)
#
# WHY Round Robin:
# - Our API is stateless (JWT, Redis rate limits, MySQL — all external).
#   Any replica can handle any request. No "sticky sessions" needed.
# - Simple, predictable, and fair. Each replica gets equal traffic.
# - No overhead measuring "least connections" or hashing IPs.
#
# ALTERNATIVES we considered but did NOT use:
# - least_conn: Sends to the server with fewest active connections.
#   Useful when requests have widely varying processing times.
#   Our requests are relatively uniform (~5ms for reads, ~50ms for orders).
# - ip_hash: Same client IP always hits the same backend.
#   Useful for session-based auth. We use stateless JWT, so unnecessary.
#   ALSO: ip_hash behind NAT (college WiFi) would overload one server.
# - weighted: Assign more traffic to more powerful servers.
#   All our replicas use the same Docker image = same capacity.

upstream api_backend {
    # Docker Compose DNS resolves these service names to container IPs.
    # These are NOT localhost — they're internal Docker network addresses.
    server api-1:3000;
    server api-2:3000;
    server api-3:3000;
}

# ============================================
# HTTP Server Block
# ============================================
server {
    # Listen on port 80 inside the Nginx container.
    # Docker Compose maps host:80 → container:80.
    listen 80;
    server_name localhost;

    # ============================================
    # Proxy Settings
    # ============================================

    # proxy_pass: Forward ALL requests to the upstream group.
    # Nginx acts as the client from Express's perspective.
    location / {
        proxy_pass http://api_backend;

        # ============================================
        # Proxy Headers — Critical for correct behavior
        # ============================================
        # Without these, Express sees Nginx as the client.
        # Rate limiting would limit Nginx's IP (one IP = all traffic blocked).

        # X-Real-IP: The actual client IP (not Nginx's IP).
        # Express reads this when trust proxy is enabled.
        proxy_set_header X-Real-IP $remote_addr;

        # X-Forwarded-For: Chain of proxy IPs the request passed through.
        # $proxy_add_x_forwarded_for appends the client IP to any existing chain.
        # Express uses this for req.ip when trust proxy is set.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # X-Forwarded-Proto: Whether the original request was HTTP or HTTPS.
        # Important for generating correct redirect URLs and secure cookies.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Host: Preserve the original Host header from the client.
        # Without this, Express sees "api-1:3000" as the host.
        proxy_set_header Host $host;

        # ============================================
        # Connection Handling
        # ============================================
        # HTTP/1.1 supports keep-alive connections.
        # Without this, Nginx opens a new TCP connection for every request.
        proxy_http_version 1.1;

        # Clear the Connection header to allow keep-alive between
        # Nginx and the backend (Express). By default HTTP/1.0 sends
        # "Connection: close" which forces reconnection.
        proxy_set_header Connection "";

        # ============================================
        # Timeouts
        # ============================================
        # How long Nginx waits for the backend to establish a connection.
        proxy_connect_timeout 10s;

        # How long Nginx waits for the backend to send the response body.
        # During flash sales, some order requests might take longer due
        # to MySQL row-lock contention.
        proxy_read_timeout 30s;

        # How long Nginx waits to send data to the backend.
        proxy_send_timeout 10s;
    }

    # ============================================
    # Nginx Status Page (for debugging/monitoring)
    # ============================================
    location /nginx-status {
        stub_status on;
        # In production, restrict this to internal IPs only.
    }
}
