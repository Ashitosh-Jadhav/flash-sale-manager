# ============================================
# Grafana Provisioning — Prometheus Data Source
# ============================================
# This file auto-configures Grafana to connect to Prometheus
# on first startup. No manual setup required.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
